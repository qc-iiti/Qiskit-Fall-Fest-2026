name: Keep backend awake

on:
  schedule:
    # Runs every 10 minutes — comfortably under Render's 15-minute sleep window
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" "${{ vars.BACKEND_URL }}" || true
